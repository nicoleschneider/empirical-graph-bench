[project]
name = "egb"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "networkx==3.2.1",
    "scikit-learn==1.9.1",
    "tqdm==4.66.2",
    "numpy==2.4.6",
    "pandas==3.0.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egb"]

[tool.ruff]
line-length = 100
target-version = "py311"
